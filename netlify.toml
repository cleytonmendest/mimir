# Hospedagem do app no Netlify (ver docs/runbooks/hospedagem.md).
# O Node vem do .nvmrc; VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY ficam nas variáveis do site (não aqui).

[build]
  command = "npm run build"
  publish = "dist"

# SPA: /cadastro, /definir-senha etc. não são arquivos. Sem isso, recarregar a página dá 404.
# Sem "force", um arquivo que existe de verdade (assets, favicon) continua sendo servido como arquivo.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# O Vite põe um hash no nome de tudo em /assets, então esses arquivos nunca mudam de conteúdo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    # O link de ativação leva o token na URL (/definir-senha?token=...): nada de Referer.
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # connect-src: o banco, o login e as Edge Functions ficam em <projeto>.supabase.co.
    # Ao ligar o Sentry (bloco H.2) e o Turnstile (modo Livre), some o endereço deles em connect-src,
    # script-src e frame-src. Se o Supabase ganhar domínio próprio, troque o curinga por ele.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
