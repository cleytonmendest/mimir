# Atualizações de dependências, uma vez por semana, em grupos para não abrir 20 PRs de uma vez.
# Cada PR passa pelo mesmo CI ("CI ok"); nenhum entra sem ele verde.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
      producao:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
