# Atualizações de dependências, uma vez por semana, em grupos para não abrir 20 PRs de uma vez.
# Cada PR passa pelo mesmo CI ("CI ok"); nenhum entra sem ele verde.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    ignore:
      # Os tipos acompanham a versão do Node do projeto (.nvmrc, hoje 22), não a mais nova: tipos de
      # um Node maior fazem o TypeScript aceitar APIs que o runtime não tem. Quem sobe o Node sobe os
      # tipos junto, de propósito.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
      producao:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
